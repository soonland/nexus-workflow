services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexus_workflow
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # A web UI for the database, for looking at the per-tenant schemas and tables. Development only.
  # Not started by a plain `docker compose up -d` (it is in the "tools" profile, so CI does not pull
  # it); start it with:  docker compose up -d pgadmin   then open http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Desktop mode: no pgAdmin login. Safe only because the port is bound to this machine below.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # 127.0.0.1 only: this UI has no login, so it must not be reachable from the network
      - "127.0.0.1:5050:80"
    volumes:
      # The "nexus" server is registered on first start; its password is the one of the db service (nexus)
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
